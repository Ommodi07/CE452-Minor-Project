[project]
name = "research-analyst-backend"
version = "0.1.0"
description = "FastAPI + LangGraph backend for the AI Research Analyst multi-agent system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "langgraph-checkpoint-postgres>=3.1",
    "chromadb>=0.5",
    "duckduckgo_search>=6.0",
    "python-docx>=1.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
